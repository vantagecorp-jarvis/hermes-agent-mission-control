# Requires Docker Compose >= 2.30 for raw env files (preserves scrypt $).
services:
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file:
      - path: .env.production
        format: raw
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/data
      - draft_visuals:/app/public/draft-visuals
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    env_file:
      - path: .env.db
        format: raw
    # Deliberately no host ports. Only the Compose network can reach Postgres.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
  schema:
    profiles: [tools]
    build:
      context: .
      target: schema
    env_file:
      - path: .env.production
        format: raw
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  postgres_data:
  app_data:
  draft_visuals:
